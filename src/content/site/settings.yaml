name: Daniel Jancar
description: Daniel Jancar is a project manager and software developer from Lucerne, Switzerland, who builds apps, organises events and takes photos.
email: daniel@danieljancar.dev
headline: Project management, software and photography.
about: |-
  I work in project management at Luzerner Kantonalbank, where I also did my apprenticeship as an application developer. After work I build Cranny with two friends, help organise NG Switzerland and take photos of Lucerne, the mountains and events around town.

  When I'm not at a keyboard you'll find me outside, in the gym, making music with my Guggenmusig or hiking in the mountains.
