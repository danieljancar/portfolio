name: Daniel Jancar
description: Daniel Jancar is a project manager and software developer from Lucerne, Switzerland, who builds apps, organises events and takes photos.
email: daniel@danieljancar.dev
headline: Project management, software and photography.
about: |-
  I like making things.

  Sometimes that means writing code and building a product. Sometimes it means taking photos, editing a video, designing something, organizing an event, or working on a completely random idea that seemed interesting at the time.

  During the week I work in project management at Luzerner Kantonalbank, where I also did my apprenticeship as an application developer. Next to that I help organise NG Switzerland, an Angular conference in Lucerne.

  My interests have naturally taken me across technology, creative work, communities, events and entrepreneurship. I enjoy working with people who are passionate about what they do and creating things together, whether that's a personal project, a community event, a piece of content or something entirely different.

  You'll usually find me working on one of my many projects, programming, behind a camera, editing photos or videos, exploring new ideas, making music, spending time with friends or somewhere in the mountains.
